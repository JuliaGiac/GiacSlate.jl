<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="GiacSlate.jl">
  <title>GiacSlate.jl</title>
  <!-- The slate: the notebook frame. -->
  <rect x="8" y="10" width="80" height="76" rx="12"
        fill="none" stroke="#2a3f5f" stroke-width="4"/>
  <!-- Its title bar, and three cells in Julia's colors. -->
  <line x1="8" y1="28" x2="88" y2="28" stroke="#2a3f5f" stroke-width="4"/>
  <circle cx="20" cy="19" r="3.2" fill="#cb3c33"/>
  <circle cx="31" cy="19" r="3.2" fill="#389826"/>
  <circle cx="42" cy="19" r="3.2" fill="#9558b2"/>
  <!-- The integral sign: the computer algebra. -->
  <path d="M40 74 C40 74 46 74 48 66 C51 54 49 42 52 34 C54 28 60 28 60 28"
        fill="none" stroke="#9558b2" stroke-width="5" stroke-linecap="round"/>
  <!-- The live math field's caret. -->
  <line x1="68" y1="46" x2="68" y2="70" stroke="#cb3c33" stroke-width="4" stroke-linecap="round"/>
</svg>
